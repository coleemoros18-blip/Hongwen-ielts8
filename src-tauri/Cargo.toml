[package]
name = "sentence-memory"
version = "0.1.0"
description = "Private sentence memory trainer"
authors = ["you"]
edition = "2021"

[lib]
name = "sentence_memory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
